    "google-chrome",
    "google-chrome-beta",
    "microsoft-edge-stable-bin",
    "brave-bin",
    "zen-browser-bin",
    "android-studio",
    "cursor-bin",
    "visual-studio-code-bin",
    "vscodium-bin",
